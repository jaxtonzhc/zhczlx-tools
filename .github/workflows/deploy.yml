name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          # Copy HTML pages to root
          cp src/pages/*.html .

          # Fix paths for root deployment (../css/ -> css/, ../js/ -> js/, ../assets/ -> assets/)
          for f in *.html; do
            sed -i 's|href="../css/|href="css/|g' "$f"
            sed -i 's|src="../js/|src="js/|g' "$f"
            sed -i 's|src="../assets/|src="assets/|g' "$f"
            sed -i 's|href="../assets/|href="assets/|g' "$f"
          done

          # Copy CSS/JS directories
          cp -r src/css css
          cp -r src/js js

          # Copy assets
          mkdir -p assets
          cp src/assets/* assets/

          # Copy public files to root
          cp public/CNAME .
          cp public/robots.txt .
          cp public/sitemap.xml .
          cp public/google*.html .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
